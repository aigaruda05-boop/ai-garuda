<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color:white;
}

.container{
    width:300px;
    margin:100px auto;
    background: rgba(255,255,255,0.1);
    padding:20px;
    border-radius:10px;
    text-align:center;
}

input, button{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

input{
    background:white;
    color:black;
}

button{
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>

<div class="container">
<h2>Admin Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
