<!DOCTYPE html>
<html>
<head>
<title>AI GARUDA</title>

<style>
body{
    margin:0;
    font-family:Arial;
    color:white;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
}

.navbar{
    background: rgba(0,0,0,0.4);
    padding:25px;
    text-align:center;
    position:relative;
}

.nav-right{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
}

.report-btn{
    background:#ef4444;
    padding:8px 15px;
    border-radius:6px;
    color:white;
    text-decoration:none;
}

.header{
    text-align:center;
    padding:40px;
}

.search-box input{
    padding:10px;
    width:250px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:white;
    color:black;
    width:250px;
    margin:15px;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>AI GARUDA</h2>

    <div class="nav-right">
        <a href="/add" class="report-btn">Report Missing</a>
    </div>
</div>

<div class="header">
    <h1>Missing Persons Network</h1>

    <form method="GET" class="search-box">
        <input type="text" name="search" placeholder="Search by name or place">
        <button>Search</button>
    </form>
</div>

<div class="container">

{% for person in persons %}
<div class="card">

<img src="{{ url_for('static', filename='uploads/' + person[10]) }}">

<h3>{{person[1]}}</h3>

<p>{{person[3]}}, {{person[4]}}</p>

<a href="/person/{{person[0]}}">View Details</a>

</div>
{% endfor %}

</div>

</body>
</html>
